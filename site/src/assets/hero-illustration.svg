<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Three design directions: sidebar, dashboard grid, and kanban wireframes</title>

  <!-- Background -->
  <rect width="800" height="500" fill="#0c0a09"/>

  <!-- Subtle grid dots -->
  <g fill="#10b981" fill-opacity="0.08">
    <circle cx="80" cy="80" r="1.5"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="320" cy="80" r="1.5"/>
    <circle cx="440" cy="80" r="1.5"/>
    <circle cx="560" cy="80" r="1.5"/>
    <circle cx="680" cy="80" r="1.5"/>
    <circle cx="80" cy="420" r="1.5"/>
    <circle cx="200" cy="420" r="1.5"/>
    <circle cx="320" cy="420" r="1.5"/>
    <circle cx="440" cy="420" r="1.5"/>
    <circle cx="560" cy="420" r="1.5"/>
    <circle cx="680" cy="420" r="1.5"/>
  </g>

  <!-- Card 1: Sidebar layout -->
  <g transform="translate(40 110)">
    <rect x="0" y="0" width="220" height="280" rx="6" fill="#0c0a09" stroke="#10b981" stroke-width="1.5"/>
    <!-- Sidebar -->
    <rect x="12" y="12" width="64" height="256" rx="3" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1"/>
    <line x1="24" y1="36" x2="64" y2="36" stroke="#34d399" stroke-width="2"/>
    <line x1="24" y1="56" x2="56" y2="56" stroke="#57534e" stroke-width="2"/>
    <line x1="24" y1="76" x2="60" y2="76" stroke="#57534e" stroke-width="2"/>
    <line x1="24" y1="96" x2="50" y2="96" stroke="#57534e" stroke-width="2"/>
    <line x1="24" y1="116" x2="58" y2="116" stroke="#57534e" stroke-width="2"/>
    <!-- Main content lines -->
    <line x1="92" y1="24" x2="200" y2="24" stroke="#f5f5f4" stroke-width="3"/>
    <line x1="92" y1="48" x2="170" y2="48" stroke="#57534e" stroke-width="2"/>
    <rect x="92" y="68" width="108" height="80" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <line x1="92" y1="164" x2="200" y2="164" stroke="#57534e" stroke-width="2"/>
    <line x1="92" y1="180" x2="184" y2="180" stroke="#57534e" stroke-width="2"/>
    <line x1="92" y1="196" x2="190" y2="196" stroke="#57534e" stroke-width="2"/>
    <rect x="92" y="220" width="64" height="24" rx="3" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.5"/>
    <!-- Label -->
    <text x="0" y="304" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#34d399">sidebar</text>
  </g>

  <!-- Card 2: Dashboard grid -->
  <g transform="translate(290 110)">
    <rect x="0" y="0" width="220" height="280" rx="6" fill="#0c0a09" stroke="#10b981" stroke-width="1.5"/>
    <!-- Top bar -->
    <line x1="12" y1="24" x2="100" y2="24" stroke="#f5f5f4" stroke-width="3"/>
    <rect x="160" y="14" width="48" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <!-- 2x2 grid of stat cards -->
    <rect x="12" y="48" width="96" height="64" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <line x1="22" y1="64" x2="60" y2="64" stroke="#57534e" stroke-width="2"/>
    <line x1="22" y1="86" x2="80" y2="86" stroke="#34d399" stroke-width="3"/>

    <rect x="116" y="48" width="92" height="64" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <line x1="126" y1="64" x2="166" y2="64" stroke="#57534e" stroke-width="2"/>
    <line x1="126" y1="86" x2="180" y2="86" stroke="#ec4899" stroke-width="3"/>

    <rect x="12" y="124" width="96" height="64" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <line x1="22" y1="140" x2="56" y2="140" stroke="#57534e" stroke-width="2"/>
    <line x1="22" y1="162" x2="76" y2="162" stroke="#34d399" stroke-width="3"/>

    <rect x="116" y="124" width="92" height="64" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <line x1="126" y1="140" x2="170" y2="140" stroke="#57534e" stroke-width="2"/>
    <line x1="126" y1="162" x2="172" y2="162" stroke="#34d399" stroke-width="3"/>

    <!-- Wide chart -->
    <rect x="12" y="200" width="196" height="64" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <polyline points="20,250 50,236 80,242 110,220 140,228 170,212 200,218" fill="none" stroke="#34d399" stroke-width="2"/>

    <text x="0" y="304" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#34d399">dashboard</text>
  </g>

  <!-- Card 3: Kanban -->
  <g transform="translate(540 110)">
    <rect x="0" y="0" width="220" height="280" rx="6" fill="#0c0a09" stroke="#10b981" stroke-width="1.5"/>
    <line x1="12" y1="24" x2="80" y2="24" stroke="#f5f5f4" stroke-width="3"/>
    <!-- 3 columns -->
    <g transform="translate(12 44)">
      <line x1="0" y1="0" x2="56" y2="0" stroke="#34d399" stroke-width="2"/>
      <rect x="0" y="12" width="60" height="36" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="22" x2="48" y2="22" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="32" x2="36" y2="32" stroke="#57534e" stroke-width="1.5"/>
      <rect x="0" y="56" width="60" height="36" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="66" x2="50" y2="66" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="76" x2="40" y2="76" stroke="#57534e" stroke-width="1.5"/>
      <rect x="0" y="100" width="60" height="36" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="110" x2="44" y2="110" stroke="#57534e" stroke-width="1.5"/>
    </g>
    <g transform="translate(80 44)">
      <line x1="0" y1="0" x2="56" y2="0" stroke="#ec4899" stroke-width="2"/>
      <rect x="0" y="12" width="60" height="36" rx="3" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/>
      <line x1="6" y1="22" x2="48" y2="22" stroke="#f5f5f4" stroke-width="1.5"/>
      <line x1="6" y1="32" x2="40" y2="32" stroke="#57534e" stroke-width="1.5"/>
      <rect x="0" y="56" width="60" height="36" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
      <line x1="6" y1="66" x2="50" y2="66" stroke="#57534e" stroke-width="1.5"/>
    </g>
    <g transform="translate(148 44)">
      <line x1="0" y1="0" x2="56" y2="0" stroke="#34d399" stroke-width="2"/>
      <rect x="0" y="12" width="60" height="36" rx="3" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
      <line x1="6" y1="22" x2="48" y2="22" stroke="#f5f5f4" stroke-width="1.5"/>
      <line x1="6" y1="32" x2="36" y2="32" stroke="#57534e" stroke-width="1.5"/>
      <rect x="0" y="56" width="60" height="36" rx="3" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
      <line x1="6" y1="66" x2="42" y2="66" stroke="#f5f5f4" stroke-width="1.5"/>
    </g>

    <text x="0" y="304" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#34d399">kanban</text>
  </g>

  <!-- Caption -->
  <text x="400" y="464" font-family="ui-monospace, 'SF Mono', monospace" font-size="14" fill="#57534e" text-anchor="middle">three directions, one prompt</text>
</svg>
